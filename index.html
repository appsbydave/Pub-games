  }
  function bestTrump(hand) {
    let best = null;
    for (const tr of [0, 1, 2, 3, 4, 5, 6, 'D']) { const r = trumpValue(hand, tr); if (!best || r.ne > best.ne) best = { ...r, tr }; }
    return best;
  }
  function hintFor(hand) {
    const b = bestTrump(hand);
    if (!b.v) return `Your best trumps look like ${trumpName(b.tr).toLowerCase()} (${b.n} of them). Not much to bid on, so passing is fine.`;
    return `Your hand suits ${trumpName(b.tr).toLowerCase()}: ${b.n} trumps. Worth a bid of about ${b.v}.`;
  }
  function aiBid(st, i) {
    const b = st.bid, hand = st.players[i].hand, mine = bestTrump(hand).v;
    const mustBid = i === st.dealer && b.high === 0;
    if (mustBid) return doBid(st, i, 30);
    const need = Math.max(30, b.high + 1);
    if (!mine || mine < need) return doBid(st, i, 0);
    if (b.by >= 0 && team(b.by) === team(i) && mine < b.high + 3) return doBid(st, i, 0);
    return doBid(st, i, mine >= 42 && need <= 42 ? 42 : need + Math.floor((mine - need) / 2));
  }
  function aiPlay(st, i) {
    const hand = st.players[i].hand, tr = st.trump, L = legal(hand, st.trick, tr), pos = st.trick.length;
    const me = team(i), bt = team(st.decl);
    const known = new Set([...hand, ...st.played, ...st.trick.map(x => x.t)].map(key));
    const unknown = set28().filter(t => !known.has(key(t)));
    const beatenBy = (t, s) => unknown.some(u => power(u, s, tr) > power(t, s, tr));
    const master = t => !beatenBy(t, ledSuit(t, tr));
    const cheap = arr => [...arr].sort((x, y) => COUNT(x) - COUNT(y) || isTrump(x, tr) - isTrump(y, tr) || (x.a + x.b) - (y.a + y.b))[0];
    const rich = arr => [...arr].sort((x, y) => COUNT(y) - COUNT(x) || isTrump(x, tr) - isTrump(y, tr) || (x.a + x.b) - (y.a + y.b))[0];
    if (pos === 0) {
      const trumps = L.filter(t => isTrump(t, tr)), trumpsOut = unknown.filter(t => isTrump(t, tr)).length;
      if (me === bt && trumps.length && trumpsOut) return [...trumps].sort((x, y) => rank(y, 'T', tr) - rank(x, 'T', tr))[0];
      const m = L.filter(t => !isTrump(t, tr) && master(t));
      if (m.length) return rich(m);
      const side = L.filter(t => !isTrump(t, tr));
      return cheap(side.length ? side : L);
    }
    const s = ledSuit(st.trick[0].t, tr), cur = trickWinner(st.trick, tr);
    const winning = L.filter(t => trickWinner([...st.trick, { p: i, t }], tr) === i);
    if (team(cur) === me) {
      const pt = st.trick.find(x => x.p === cur).t;
      if (pos === 3 || !beatenBy(pt, s)) return rich(L.filter(t => !isTrump(t, tr) || L.every(u => isTrump(u, tr))));
      return cheap(L);
    }
    if (winning.length) {
      const tp = sum(st.trick.map(x => COUNT(x.t)));
      const safe = winning.filter(t => !beatenBy(t, s));
      if (pos === 3) return rich(winning);
      if (safe.length) return rich(safe);
      if (tp >= 5) return [...winning].sort((x, y) => power(y, s, tr) - power(x, s, tr))[0];
    }
    return cheap(L);
  }

  /* --- flow --- */
  const actor = st => st.phase === 'bid' ? st.bid.turn : st.phase === 'trump' ? st.decl : st.phase === 'play' ? st.turn : -1;
  function deal(st) {
    const tiles = shuffle(set28());
    st.players.forEach((p, i) => { p.hand = sortHand(tiles.slice(i * 7, i * 7 + 7), null); p.said = ''; p.hand.forEach((t, k) => { t.deal = true; t.delay = k * 50; }); });
    st.bid = { turn: (st.dealer + 1) % 4, high: 0, by: -1, n: 0 };
    st.phase = 'bid'; st.decl = -1; st.trump = null; st.trick = []; st.played = []; st.taken = [[], []]; st.tricks = [0, 0]; st.res = null;
    log(st, `Hand ${st.handNo + 1}. ${nm(st, st.dealer)} shakes. Everyone draws seven.`);
  }
  function doBid(st, i, v) {
    const b = st.bid, p = st.players[i], forced = i === st.dealer && b.high === 0;
    if (v) { b.high = v; b.by = i; p.said = bidLabel(v); log(st, `${nm(st, i)} bids ${bidLabel(v)}${forced ? ' (everyone passed, so the shaker has to bid)' : ''}.`); }
    else { p.said = 'Pass'; log(st, `${nm(st, i)} passes.`); }
    b.n++;
    if (b.n < 4) { b.turn = (b.turn + 1) % 4; return; }
    st.decl = b.by; st.phase = 'trump';
  }
  function setTrump(st, tr) {
    st.trump = tr; st.phase = 'play'; st.turn = st.decl;
    st.players.forEach(p => sortHand(p.hand, tr));
    log(st, `${nm(st, st.decl)} names ${trumpName(tr).toLowerCase()} as trumps.`);
  }
  function play(st, i, t) {
    const p = st.players[i];
    p.hand = p.hand.filter(x => x !== t);
    st.trick.push({ p: i, t });
    if (st.trick.length === 4) { st.phase = 'trick'; st.trickWin = trickWinner(st.trick, st.trump); }
    else st.turn = (st.turn + 1) % 4;
  }
  function collect(st) {
    const w = st.trickWin, k = team(w), c = sum(st.trick.map(x => COUNT(x.t)));
    st.taken[k].push(...st.trick.map(x => x.t)); st.tricks[k]++; st.played.push(...st.trick.map(x => x.t));
    log(st, `${nm(st, w)} takes the trick${c ? `, with ${c} in the count` : ''}.`);
    st.trick = []; st.turn = w; st.phase = 'play';
    const bt = team(st.decl), bp = teamPts(st, bt), dp = teamPts(st, 1 - bt), bid = st.bid.high, done = st.tricks[0] + st.tricks[1];
    if (bid >= 42) { if (st.tricks[1 - bt] > 0) return endHand(st, false); if (done === 7) return endHand(st, true); return; }
    if (bp >= bid) return endHand(st, true);
    if (dp > 42 - bid) return endHand(st, false);
    if (done === 7) endHand(st, bp >= bid);
  }
  function endHand(st, made) {
    const bt = team(st.decl), m = st.bid.high === 84 ? 2 : 1, win = made ? bt : 1 - bt;
    st.marks[win] += m;
    const done = st.tricks[0] + st.tricks[1];
    st.res = { made, bt, m, win, bp: teamPts(st, bt), dp: teamPts(st, 1 - bt), early: done < 7 };
    st.phase = 'end'; st.handNo++;
    log(st, made ? `${teamName(st, bt)} make their bid of ${st.bid.high}: ${plural(m, 'mark')}.` : `Set! ${teamName(st, 1 - bt)} take ${plural(m, 'mark')}.`);
    if (st.marks[win] >= st.target) st.over = { t: `${teamName(st, win)} <em>win!</em>`, s: `First team to ${st.target} marks. Final score ${st.marks[win]} to ${st.marks[1 - win]}.`, ic: `<svg viewBox="0 0 100 100" width="44"><g transform="rotate(-20 50 50) translate(0 25) scale(.5)">${domInner(5, 3, true, false)}</g></svg>` };
  }
  const teamName = (st, k) => `${esc(st.players[k].name)} &amp; ${esc(st.players[k + 2].name)}`;
  function ai(st) {
    const i = actor(st);
    if (st.phase === 'bid') return aiBid(st, i);
    if (st.phase === 'trump') return setTrump(st, bestTrump(st.players[i].hand).tr);
    if (st.phase === 'play') return play(st, i, aiPlay(st, i));
  }
  const domBtn = (t, o = {}) => `<${o.act ? 'button' : 'div'} class="dom ${o.cls || ''}${t.deal && o.anim ? ' dealing' : ''}" ${o.act ? `data-act="${o.act}" data-arg="${t.id}"` : ''} ${t.deal && o.anim ? `style="animation-delay:${t.delay}ms"` : ''} aria-label="${t.a}-${t.b}${COUNT(t) ? `, worth ${COUNT(t)}` : ''}">${domSVG(t.a, t.b, true, o.orange)}${o.count && COUNT(t) ? `<span class="cnt">${COUNT(t)}</span>` : ''}</${o.act ? 'button' : 'div'}>`;
  const backTile = () => `<div class="dom xs back"></div>`;

  G.t42 = {
    id: 't42', kind: 'dominoes', name: 'Texas 42', tagline: 'Bid. Name trumps. Take tricks.', players: '4 players', min: 4, max: 4, defN: 4, priv: true,
    art: () => `<svg viewBox="0 0 150 120"><g transform="translate(46 2) rotate(-6 50 25) scale(.5)">${domInner(4, 6, true)}</g><g transform="translate(0 52) rotate(12 50 25) scale(.5)">${domInner(6, 5, false)}</g><g transform="translate(70 66) rotate(8 50 25) scale(.42)">${domInner(3, 1, false)}</g></svg>`,
    icon: () => `<svg viewBox="0 0 110 50" height="44"><g transform="translate(2 4) scale(.5)">${domInner(5, 5, false)}</g></svg>`,
    info: [['dominoes', '28 dominoes', 'a double-six set'], ['pencil', 'Marks kept', 'for you, as you play'], ['people', '4 players', 'two teams, partners opposite']],
    note: 'Players 1 and 3 are partners, against 2 and 4.',
    options: [{ key: 'target', label: 'Play to', help: 'First team to this many marks wins.', def: 7, choices: [[7, '7 marks'], [3, '3 · quick']] }],
    create(players, o) { const st = { players: players.map(p => ({ ...p, hand: [] })), dealer: 3, marks: [0, 0], target: o.target, handNo: 0 }; deal(st); return st; },
    actor,
    next(st) {
      if (st.phase === 'trick') return { ms: 1400, run: () => collect(st) };

      if (a >= 0 && st.players[a].cpu) return { ms: st.phase === 'play' ? 850 : 1100, run: () => ai(st) };
      if (st.phase === 'end' && !st.over && !anyHuman(st)) return { ms: 3000, run: () => { st.dealer = (st.dealer + 1) % 4; deal(st); } };
      return null;
    },
    act(st, a, arg) {
      if (a === 'next' && st.phase === 'end' && !st.over) { st.dealer = (st.dealer + 1) % 4; return deal(st); }
      const i = actor(st); if (i < 0 || st.players[i].cpu) return;
      if (st.phase === 'bid') {
        const v = +arg, b = st.bid;
        if (a === 'pass' && !(i === st.dealer && b.high === 0)) return doBid(st, i, 0);

        return;
      }
      if (st.phase === 'trump' && a === 'trump') return setTrump(st, arg === 'D' ? 'D' : +arg);
      if (st.phase === 'play' && a === 'play') {
        const p = st.players[i], t = p.hand.find(x => x.id === +arg);
        if (t && legal(p.hand, st.trick, st.trump).includes(t)) play(st, i, t);
      }
    },
    view(st, viewer) {
      const a = actor(st), me = viewer >= 0 ? viewer : 0, showMine = viewer >= 0, hum = humanTurn(st, a) && viewer === a;
      const tr = st.trump, D = st.decl;
      const mt = team(me);
      const tchip = k => { const on = a >= 0 && team(a) === k; return `<div class="chip ${on ? 'on' : ''}" style="flex:1">${D >= 0 && team(D) === k ? '<span class="tag">Bidders</span>' : ''}<div class="who">${I.people}${esc(st.players[k].name)} &amp; ${esc(st.players[k + 2].name)}</div><div class="v">${st.marks[k]}<small> / ${st.target} marks</small></div><div class="sub">${st.phase === 'bid' ? '&nbsp;' : `${plural(teamPts(st, k), 'point')} this hand`}</div></div>`; };
      let h = `<div class="chips">${tchip(mt)}${tchip(1 - mt)}</div>`;
      let line = '';
      if (st.phase === 'bid') line = st.bid.by >= 0 ? `Top bid: ${bidLabel(st.bid.high)} by ${esc(st.players[st.bid.by].name)}` : 'Bidding starts at 30';
      else if (tr !== null) line = `${esc(st.players[D].name)} bid ${bidLabel(st.bid.high)} · trumps: ${trumpName(tr)}`;
      else line = `${esc(st.players[D].name)} won the bid at ${bidLabel(st.bid.high)}`;
      h += `<div class="hint" style="margin:0 0 8px;font-weight:600;color:var(--plum);font-size:14px">${line}</div>`;
      const seat = (i, cls) => {
        const p = st.players[i], t = st.trick.find(x => x.p === i);
        const role = team(i) === mt ? (i === me ? '' : 'Partner') : 'Opponent';
        return `<div class="t42seat ${cls} ${i === a ? 'on' : ''}"><div class="nm">${who(p)}${esc(p.name)}${i === st.dealer ? ' <span class="dealer">Shaker</span>' : ''}</div><div class="meta">${st.phase === 'bid' || st.phase === 'trump' ? (p.said ? `Says <b>${p.said}</b>` : role) : `${role}${i === D ? ' · bidder' : ''}`}</div>
          <div class="slot">${t ? `<div class="pop">${domBtn(t.t, { cls: st.phase === 'trick' && st.trickWin === i ? 'win' : '' })}</div>` : (st.phase === 'play' || st.phase === 'trick') ? '<div class="dom ghost"></div>' : i === me ? '' : `<div class="backs">${p.hand.map(backTile).join('')}</div>`}</div></div>`;
      };
      h += `<div class="board t42table">${seat((me + 2) % 4, 'n')}${seat((me + 1) % 4, 'w')}${seat((me + 3) % 4, 'e')}${seat(me, 's')}</div>`;
      h += `<div class="board" style="margin-top:10px">`;
      if (st.phase === 'bid') {
        const p = st.players[a], forced = a === st.dealer && st.bid.high === 0;
        h += `<div class="status">${hum ? 'Your bid' : esc(p.name) + ' is bidding'}<small>${hum ? (forced ? 'Everyone passed, so the shaker must bid 30 or more.' : 'One bid each, going left. Beat the top bid, or pass.') : 'One bid each, going left.'}</small></div>`;
        if (hum) {
          h += `<div class="hint">${hintFor(p.hand)}</div>`;
          h += `<div class="bidgrid">${BIDS.map(v => `<button class="btn ${v >= 42 ? 'wide2' : ''}" data-act="bid" data-arg="${v}" ${v <= st.bid.high ? 'disabled' : ''}>${bidLabel(v)}</button>`).join('')}</div>`;
          h += `<div class="btns">${btn('Pass', 'pass', '', '', forced)}</div>`;
        }
      } else if (st.phase === 'trump') {
        const p = st.players[D];
        h += `<div class="status">${hum ? `You won the bid at ${bidLabel(st.bid.high)}` : `${esc(p.name)} is choosing trumps`}<small>${hum ? 'Name trumps: a suit, or doubles. Then you lead.' : '&nbsp;'}</small></div>`;
        if (hum) h += `<div class="gamepick" style="grid-template-columns:repeat(4,1fr)">${[6, 5, 4, 3, 2, 1, 0, 'D'].map(x => { const n = p.hand.filter(t => isTrump(t, x)).length; return `<button class="btn" data-act="trump" data-arg="${x}"><span>${trumpName(x)}</span><span class="sub">${n} in hand</span></button>`; }).join('')}</div>`;
      } else if (st.phase === 'play' || st.phase === 'trick') {
        const s = st.trick.length ? ledSuit(st.trick[0].t, tr) : null;
        h += `<div class="status" style="font-size:16px">${st.phase === 'trick' ? `${esc(st.players[st.trickWin].name)} takes it` : hum ? (st.trick.length ? `Follow ${s === 'T' ? 'trumps' : NAMES[s].toLowerCase()} if you can` : 'Your lead') : `${esc(st.players[a].name)} to play`}<small>${st.phase === 'trick' ? '&nbsp;' : hum && st.trick.length ? 'Faded tiles can’t be played.' : `Trick ${st.tricks[0] + st.tricks[1] + 1} of 7`}</small></div>`;
      } else if (st.phase === 'end' && st.res) {
        const r = st.res;
        h += `<div class="status pop">${r.made ? `${teamName(st, r.bt)} make it!` : 'Set!'}<small>${r.made ? `Bid ${bidLabel(st.bid.high)}${r.early ? ', made with tricks to spare' : ''}.` : `${teamName(st, r.bt)} couldn’t make ${bidLabel(st.bid.high)}${r.early ? ', so the hand stops there' : ''}.`}</small></div>`;
        h += `<div class="mt">${tableHTML(['This hand', 'Points'], [
          { t: teamName(st, r.bt), s: `Bid ${bidLabel(st.bid.high)}`, v: r.bp, hi: r.made },
          { t: teamName(st, 1 - r.bt), s: 'Defending', v: r.dp, hi: !r.made },
          { t: `${r.win === mt ? 'Your team' : 'Their team'} scores`, s: '', v: `+${r.m} ${r.m > 1 ? 'marks' : 'mark'}` }])}</div>`;
        if (!st.over && anyHuman(st)) h += `<div class="btns">${btn('Shake for the next hand', 'next', '', 'primary')}</div>`;
      }
      h += `</div>`;
      const mine = st.players[me].hand;
      if (mine.length) {
        const playable = hum && st.phase === 'play' ? legal(mine, st.trick, tr) : null;
        h += `<div class="domhand">${mine.map(t => {
          if (!showMine) return `<div class="dom back"></div>`;
          const ok = playable && playable.includes(t);
          return domBtn(t, { act: ok ? 'play' : '', cls: playable && !ok ? 'no' : ok ? 'ok' : '', count: true, anim: true, orange: tr !== null && isTrump(t, tr) });
        }).join('')}</div>`;
        h += `<div class="kept-lbl">${showMine ? `${esc(st.players[me].name)}’s tiles${tr !== null ? ' · trumps in orange' : ''} · count tiles marked` : 'Watching the computer play'}</div>`;
      }
      return h;
    },
    rules: {
      s1: 'Play a hand',
      steps: [['Shake the tiles.', 'Everyone draws seven.'], ['Bid once each, going left.', 'The lowest bid is 30. All pass? Dealer bids 30.'], ['Top bidder names trumps,', 'a suit or doubles, and leads first.'], ['Follow suit if you can.', 'Highest of the suit led wins, unless it’s trumped.']],
      s2: 'The count',
      score: `<div style="font-size:13px;margin-bottom:4px">Five tiles carry the count.</div>` + scoreRow(md('55 64'), '10', 'each') + scoreRow(md('50 41 32'), '5', 'each') + scoreRow(md('00 00'), '1', 'per trick') + exampleHTML(md('55 41'), '10 + 5 + 4 tricks', '= 19 points', '35 in the count + 7 tricks = 42.'),
      s3: 'Making the bid', head: ['The bid · what happens', 'Marks'],
      rows: [{ ic: '<span class="bidtag f">84</span>', t: 'Bid 84, take every trick', s: 'A sweep of all 7 for two marks.', v: 2, hi: 1 }, { ic: '<span class="bidtag">42</span>', t: 'Bid 42, take every trick', s: 'All 7 tricks for one mark.', v: 1 }, { ic: '<span class="bidtag">30</span>', t: 'Bid 30, take 30 or more', s: 'You made it!', v: 1 }, { ic: '<span class="bidtag d">30</span>', t: 'Bid 30, take 29', s: 'Set! The other team gets the mark.', v: 0 }],
      s4: 'Suits', pills: ['6-4 led', 'Sixes'],
      notes: [['Higher end sets the suit.', '6-4 leads as a six.'], ['Trumps come first.', 'If fours are trumps, 6-4 is a four.'], ['Doubles are top', 'of their suit.']],
      foot: 'First team to 7 marks <em>wins!</em>', footSub: 'Or play to 250 points if you’d rather keep a tally.', footIc: `<svg viewBox="0 0 100 100" width="48"><g transform="rotate(-20 50 50) translate(0 25) scale(.5)">${domInner(5, 3, true, false)}</g></svg>`
    }
  };
  G.t42._t = { trickWinner, legal, isTrump, rank, COUNT, set28, trumpValue, bestTrump };
})();

render();
