:root{
  --plum:#4e1f4d; --plum2:#6a3468; --plum-soft:#efe3ef;
  --sand:#f8dca8; --sand2:#fbeacb; --orange:#dd7f27; --gold:#f2a91f;
  --ink:#3b3b3b; --muted:#8b6d8b; --line:#e8d1e6; --label:#a35aa0;
  --pig:#f6b8c4; --pig2:#e98fa3; --bg:#f4ebf4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;
  padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:600}
.sheet{max-width:560px;margin:0 auto;background:#fff;border:2px solid var(--plum);border-radius:22px;
  box-shadow:0 0 0 5px #fff,0 0 0 6.5px var(--line);padding:22px 18px 18px;position:relative;min-height:calc(100vh - 40px)}
@media (min-width:600px){.sheet{padding:28px 28px 24px;margin-top:10px}}

/* Header — like the top of the rules cards */
.label{color:var(--label);font-weight:600;font-size:14px;letter-spacing:.01em;margin:0 0 2px}
.title{color:var(--plum);font-weight:700;font-size:clamp(40px,12.5vw,60px);line-height:.98;letter-spacing:-.025em;margin:0}
.title.sm{font-size:clamp(30px,9vw,42px)}
.tagline{font-weight:600;color:var(--ink);margin:8px 0 0;font-size:15px}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.head .art{flex:0 0 auto;width:118px;margin-top:-4px}
.head .art svg{width:100%;height:auto;display:block}
.rule{border:0;border-top:2px solid var(--plum);margin:16px 0 0}

.info{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--plum);border-bottom:2px solid var(--plum);margin:14px 0 18px;padding:9px 0}
.info>div{display:flex;gap:7px;align-items:flex-start;padding:0 8px;border-left:2px dashed #b9a2b8;min-width:0}
.info>div:first-child{border-left:0;padding-left:2px}
.info svg{flex:0 0 22px;width:22px;height:22px;margin-top:1px}
.info b{display:block;color:var(--plum);font-weight:700;font-size:13.5px;line-height:1.15}
.info span{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;margin-top:1px}

/* Section headings with numbered badges */
.sec{display:flex;align-items:center;gap:9px;margin:20px 0 10px;color:var(--plum);font-weight:700;font-size:21px;letter-spacing:-.01em}
.sec .n{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;background:var(--orange)}
.sec .n.p{background:var(--plum)}
.sec .right{margin-left:auto;font-size:13px;font-weight:600}

.panel{background:var(--sand);border-radius:18px;padding:14px}
.panel.lite{background:var(--sand2)}
.panel h3{margin:0 0 8px;color:var(--plum);font-size:15px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--plum);background:#fff;color:var(--plum);
  border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;min-height:46px;transition:transform .08s,background .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--plum);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{pointer-events:none;background:transparent;color:rgba(78,31,77,.42);border-color:rgba(78,31,77,.28);border-style:dashed}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns>.btn{flex:1 1 0;min-width:120px}
.btn>svg{width:19px;height:19px;flex:0 0 auto}
.btn .sub{font-weight:500;font-size:12px;opacity:.85}
.btn.stack{flex-direction:column;gap:0;line-height:1.15;padding:8px 12px}

/* Home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--plum);border-radius:16px;padding:12px;min-height:150px;position:relative;transition:transform .1s,box-shadow .15s}
.tile:active{transform:scale(.98)}
.tile:hover{box-shadow:4px 4px 0 var(--sand)}
.tile .ic{height:44px;margin-bottom:8px}
.tile .ic svg{height:44px;width:auto}
.tile .tx{display:flex;flex-direction:column;flex:1;width:100%}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:0}
.tile.wide .ic{margin:0;flex:0 0 auto;height:auto}
.tile.wide .ic svg{height:52px}
.tile b{color:var(--plum);font-size:17px;line-height:1.1;font-weight:700}
.tile small{color:var(--ink);font-size:12.5px;margin-top:4px;line-height:1.25}
.tile .pp{margin-top:auto;padding-top:8px;color:var(--muted);font-size:11.5px;display:flex;gap:4px;align-items:center}
.tile .pp svg{width:15px;height:15px}

/* Footer banner — plum strip from the bottom of each card */
.banner{background:var(--plum);color:#fff;border-radius:16px;padding:16px 18px;margin-top:20px;display:flex;align-items:center;gap:12px}
.banner .t{font-weight:700;font-size:22px;line-height:1.15}
.banner .t em{font-style:normal;color:var(--gold)}
.banner .s{color:#f6c98a;font-size:13px;margin-top:4px}
.banner .ic{margin-left:auto;flex:0 0 44px}
.banner .ic svg{width:44px;height:auto}

/* Setup */
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prow input{flex:1 1 auto;min-width:0;border:2px solid var(--plum);border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;color:var(--plum);background:#fff}
.prow input:focus{outline:3px solid var(--sand)}
.seg{display:inline-flex;border:2px solid var(--plum);border-radius:999px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:#fff;color:var(--plum);padding:8px 10px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--plum);color:#fff}
.seg button svg{width:15px;height:15px}
.seg button.on svg{stroke:#fff}
.seg button.on svg [fill]{fill:#fff}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;width:34px;height:34px;border-radius:50%;flex:0 0 34px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.opt+.opt{border-top:2px dashed rgba(78,31,77,.25)}
.opt .l b{display:block;color:var(--plum)}
.opt .l span{font-size:12.5px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

/* Top bar during play */
.bar{display:flex;align-items:center;gap:8px;margin:-6px -4px 10px}
.bar .nm{font-weight:700;color:var(--plum);font-size:18px;flex:1;text-align:center;letter-spacing:-.01em}
.iconbtn{border:2px solid var(--plum);background:#fff;color:var(--plum);border-radius:999px;height:38px;min-width:38px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.iconbtn svg{width:18px;height:18px}

/* Scoreboard chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--plum);border-radius:14px;padding:6px 10px 6px;min-width:78px;background:#fff;position:relative;transition:background .2s}
.chip .who{font-size:12px;font-weight:600;color:var(--plum);display:flex;align-items:center;gap:4px;white-space:nowrap}
.chip .who svg{width:13px;height:13px;opacity:.7}
.chip .v{font-size:20px;font-weight:700;color:var(--plum);line-height:1.1}
.chip .v small{font-size:11px;font-weight:500;color:var(--muted)}
.chip .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--sand);box-shadow:0 0 0 3px var(--orange)}
.chip.out{opacity:.45}
.chip .tag{position:absolute;top:-9px;right:6px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.chip .tag.p{background:var(--plum)}

/* Board */
.board{background:var(--sand);border-radius:20px;padding:14px;margin-top:6px;position:relative}
.board:empty{display:none}
.status{font-weight:700;color:var(--plum);font-size:18px;line-height:1.2;text-align:center}
.status small{display:block;font-weight:500;font-size:13px;color:var(--ink);margin-top:3px}
.verdict{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;min-height:30px}
.vpill{background:var(--plum);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.vpill.o{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.vpill.or{background:var(--orange)}
.hint{font-size:12.5px;color:var(--ink);text-align:center;margin-top:8px;opacity:.85}

/* Dice */
.dice{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px 0 4px;min-height:64px}
.die{border:0;background:transparent;padding:0;width:60px;height:60px;position:relative;transition:transform .15s}
.die svg{width:100%;height:100%;display:block;overflow:visible}
.die.sm{width:44px;height:44px}
.die.lift{transform:translateY(-6px)}
.die.pick::after{content:'';position:absolute;inset:-5px;border:3px solid var(--plum);border-radius:16px}
.die.dim{opacity:.4}
.die[disabled]{cursor:default}
.dice.n6{max-width:216px;margin-left:auto;margin-right:auto;gap:12px 18px}
.dice.n5 .die{width:52px;height:52px}
.dice.n5{gap:8px}
.dice.sm-row{gap:6px}
.kept-lbl{font-size:11.5px;font-weight:700;color:var(--plum);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-top:6px}
/* Real dice: tap in what landed */
.rslot{width:60px;height:60px;border:2.5px dashed rgba(78,31,77,.35);border-radius:14px;flex:0 0 auto}
.dice.n5 .rslot{width:52px;height:52px}
.dice.rsm{gap:6px;flex-wrap:nowrap;min-height:48px}
.dice.rsm .die,.dice.rsm .rslot{width:44px;height:44px}
.rpad{background:#fff;border:2px solid var(--plum);border-radius:16px;padding:8px 8px 10px;margin-top:10px}
.rpad .kept-lbl{margin:0 0 6px}
.rpad .row{display:flex;justify-content:center;gap:6px}
.rpad .die{width:44px;height:44px}
.rpad .die[disabled]{opacity:.35}
.rtag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--plum);color:var(--plum);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin-top:6px}
.rtag svg{width:14px;height:14px}
.rseg{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:13px;font-weight:600;color:var(--plum)}
.rundo{display:block;margin:8px auto 0;border:0;background:transparent;color:var(--plum);font-size:12.5px;font-weight:600;text-decoration:underline;padding:4px 8px}
.rpigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.rpigs button{border:2px solid var(--plum);background:#fff;border-radius:12px;padding:4px 2px 5px;color:var(--plum);font-weight:600;font-size:11.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center}
.rpigs button[disabled]{opacity:.35}
.rpigs button svg{width:56px;height:38px;overflow:visible}
.rpigs button b{font-size:11px;color:var(--orange)}
.rpslot{width:118px;height:96px;border:2.5px dashed rgba(78,31,77,.35);border-radius:16px;display:grid;place-items:center;color:rgba(78,31,77,.5);font-weight:700;font-size:13px}
.pigs .pig.rp{border:0;background:transparent;padding:0}
.prow.three{flex-wrap:wrap;gap:6px 8px;padding-bottom:10px;border-bottom:2px dashed rgba(78,31,77,.18)}
.prow.three input{flex:1 1 calc(100% - 50px)}
.prow.three .seg{order:2;flex:1 1 100%}
.prow.three .seg button{flex:1 1 0;justify-content:center;padding:8px 6px}
.rolling svg{animation:tumble .55s cubic-bezier(.3,.7,.4,1)}
@keyframes tumble{0%{transform:translate(-30px,-28px) rotate(-200deg) scale(.7)}60%{transform:translate(4px,4px) rotate(18deg) scale(1.06)}100%{transform:none}}
.mini{display:inline-flex;gap:3px;vertical-align:middle}
.mini svg{width:20px;height:20px;display:block}

/* Playing cards */
.pc{--w:58px;width:var(--w);height:calc(var(--w)*1.42);border:2px solid var(--plum);border-radius:8px;background:#fff;position:relative;flex:0 0 auto;color:var(--plum);
  font-weight:700;box-shadow:2px 3px 0 rgba(78,31,77,.18);transition:transform .15s,box-shadow .15s,opacity .2s;padding:0}
.pc.red{color:var(--orange)}
.pc .r{position:absolute;top:3px;left:5px;font-size:calc(var(--w)*.3);line-height:1;letter-spacing:-.04em}
.pc .s1{position:absolute;top:calc(var(--w)*.34);left:5px;width:calc(var(--w)*.2);height:calc(var(--w)*.2)}
.pc .s2{position:absolute;right:5px;bottom:5px;width:calc(var(--w)*.42);height:calc(var(--w)*.42)}
.pc.big{--w:84px}
.pc.lg{--w:70px}
.pc.sm{--w:40px;border-radius:6px;border-width:1.5px}
.pc.xs{--w:26px;border-radius:4px;border-width:1.5px;box-shadow:none}
.pc.xs .r{top:2px;left:3px}
.pc.xs .s1{display:none}
.pc.xs .s2{right:2px;bottom:2px}
.pc.back{background:var(--plum);overflow:hidden}
.pc.back::before{content:'';position:absolute;inset:4px;border:1.5px solid rgba(248,220,168,.55);border-radius:4px;
  background:radial-gradient(circle at 50% 50%,var(--orange) 0 18%,transparent 19%),repeating-linear-gradient(45deg,rgba(248,220,168,.16) 0 4px,transparent 4px 9px)}
.pc.xs.back::before{inset:2px}
button.pc.ok{cursor:pointer}
button.pc.ok:hover{transform:translateY(-4px)}
.pc.up{transform:translateY(-12px);box-shadow:0 0 0 3px var(--orange),2px 3px 0 rgba(78,31,77,.18)}
.pc.no{opacity:.45}
.pc.win{box-shadow:0 0 0 3px var(--orange)}
.pc.low{box-shadow:0 0 0 3px var(--orange),0 0 0 6px var(--plum)}
.dealing{animation:deal .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes deal{from{transform:translate(0,-60px) rotate(-12deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.flipping{animation:flip .45s ease both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.hand{display:flex;justify-content:center;padding:14px 4px 4px;min-height:96px}
.hand{--n1:9}
.hand .pc{margin-left:min(4px,calc((100% - var(--w)) / var(--n1) - var(--w)))}
.hand .pc:first-child{margin-left:0}
.cards-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* Tables (like "What beats what") */
.tbl{border:2px solid var(--plum);border-radius:12px;overflow:hidden;background:#fff}
.tbl .th{background:var(--plum);color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:space-between;padding:7px 12px}
.tbl .tr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1.5px solid var(--line)}
.tbl .tr:first-of-type{border-top:0}
.tbl .tr.hi{background:var(--sand)}
.tbl .tr.lo{background:#f6e6f3}
.tbl .tr .ic{flex:0 0 auto;display:flex;gap:3px;align-items:center}
.tbl .tr .tx{flex:1;min-width:0}
.tbl .tr .tx b{display:block;color:var(--plum);font-size:14.5px;line-height:1.2}
.tbl .tr .tx span{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.tbl .tr .v{font-weight:700;color:var(--plum);font-size:20px;text-align:right;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tbl .tr .v small{font-size:11px;font-weight:600}

/* Step list (A B C D) */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;margin-bottom:11px;font-size:14.5px}
.steps li .L{flex:0 0 26px;width:26px;height:26px;border:2px solid var(--plum);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--plum);margin-top:-1px}
.steps li b{color:var(--plum)}

/* Log */
.log{margin-top:12px;font-size:13px;color:var(--ink);max-height:120px;overflow:auto;border-top:2px dashed rgba(78,31,77,.25);padding-top:8px}
.log div{padding:2px 0}
.log div:first-child{font-weight:600;color:var(--plum)}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(46,16,45,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 8px;animation:fade .2s}
.ov .sheet{min-height:0;width:100%}
.ov.center{align-items:center}
.dialog{background:#fff;border:2px solid var(--plum);border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 0 5px #fff,0 0 0 6.5px var(--line)}
.dialog h2{color:var(--plum);margin:0 0 6px;font-size:24px}
.dialog p{margin:0 0 14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.handoff{position:fixed;inset:0;background:var(--plum);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.handoff .who{font-size:40px;font-weight:700;color:var(--gold);margin:6px 0 18px;line-height:1.05}
.handoff p{margin:0;color:#f6c98a}
.handoff .btn{border-color:#fff;margin-top:24px}

/* Players around a table (Brag / Cuckoo) */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seat{background:#fff;border:2px solid var(--plum);border-radius:14px;padding:8px 10px;position:relative;transition:box-shadow .2s,background .2s}
.seat.on{box-shadow:0 0 0 3px var(--orange)}
.seat.out{opacity:.45}
.seat.me{background:#fff9ee}
.seat .top{display:flex;align-items:center;gap:5px;font-weight:700;color:var(--plum);font-size:14px;white-space:nowrap;overflow:hidden}
.seat .top svg{width:14px;height:14px;flex:0 0 auto;opacity:.7}
.seat .meta{font-size:12px;color:var(--muted);margin:1px 0 6px;min-height:15px}
.seat .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.seat .act{font-size:12px;font-weight:600;color:var(--orange);min-height:16px;margin-top:4px}
.lives{display:flex;gap:2px}
.lives svg{width:15px;height:15px}
.dealer{background:var(--plum);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:auto}
.pot{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 12px}
.pot .amt{font-size:28px;font-weight:700;color:var(--plum)}
.pot .lbl{font-size:12px;color:var(--plum);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* Skat table */
.trick{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:6px;min-height:150px;margin:6px 0}
.trick .slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.trick .slot .nm{font-size:12px;font-weight:600;color:var(--plum);white-space:nowrap}
.trick .slot.mid{align-self:end;padding-bottom:0}
.trick .slot.side{align-self:start}
.ghost-card{width:58px;height:82px;border:2px dashed rgba(78,31,77,.3);border-radius:8px}
.opps{display:flex;justify-content:space-between;gap:8px}
.opp{flex:1;background:#fff;border:2px solid var(--plum);border-radius:14px;padding:7px 10px}
.opp.on{box-shadow:0 0 0 3px var(--orange)}
.opp .top{font-weight:700;color:var(--plum);font-size:14px;display:flex;gap:5px;align-items:center}
.opp .top svg{width:14px;height:14px;opacity:.7}
.opp .meta{font-size:12px;color:var(--muted)}
.fan{display:flex;margin-top:5px}
.fan .pc{margin-left:-17px}
.fan .pc:first-child{margin-left:0}
.gamepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gamepick .btn{flex-direction:column;gap:2px;min-height:64px;padding:6px;border-radius:14px}
.gamepick .btn svg{width:20px;height:20px}
.gamepick .btn .sub{font-size:11px}
.gamepick .btn.short{border-style:dashed}

/* Pigs */
.pigs{display:flex;justify-content:center;gap:16px;margin:12px 0 4px;min-height:96px;align-items:flex-end}
.pig{width:118px;text-align:center}
.pig svg{width:110px;height:82px;display:block;margin:0 auto;overflow:visible}
.pig .pl{font-size:13px;font-weight:700;color:var(--plum);margin-top:2px}
.tumbling svg{animation:pigtoss .8s cubic-bezier(.25,.8,.35,1)}
@keyframes pigtoss{0%{transform:translate(-50px,-70px) rotate(-340deg) scale(.6)}55%{transform:translate(6px,-6px) rotate(20deg)}75%{transform:translate(0,2px) rotate(-6deg)}100%{transform:none}}

.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.big-score{font-size:34px;font-weight:700;color:var(--plum);line-height:1}
.center{text-align:center}
.muted{color:var(--muted)}
.mt{margin-top:12px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:480px){
  .info>div{flex-direction:column;gap:3px;padding:0 6px}
  .info b{font-size:13px}
}
@media (max-width:370px){
  .die{width:52px;height:52px}
  .tiles{gap:8px}
  .tile{padding:10px}
  .seats{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

/* Dominoes (Texas 42) */
.dom{border:0;background:transparent;padding:0;width:40px;aspect-ratio:1/2;position:relative;flex:0 0 auto;transition:transform .15s,opacity .2s}
.dom svg{width:100%;height:100%;display:block;overflow:visible}
.dom.back{background:var(--plum);border-radius:8px;box-shadow:inset 0 0 0 3px rgba(248,220,168,.35),2px 3px 0 rgba(78,31,77,.2)}
.dom.xs{width:9px;border-radius:2.5px;box-shadow:inset 0 0 0 1px rgba(248,220,168,.4)}
.dom.ghost{border:2px dashed rgba(78,31,77,.3);border-radius:8px;width:34px}
.dom.no{opacity:.35}
button.dom.ok{cursor:pointer}
button.dom.ok:hover{transform:translateY(-4px)}
.dom.win::after{content:'';position:absolute;inset:-5px;border:3px solid var(--orange);border-radius:12px}
.dom .cnt{position:absolute;top:-8px;right:-8px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;line-height:1.3;border:1.5px solid #fff}
.domhand{display:flex;justify-content:center;gap:6px;padding:16px 0 4px}
.domhand .dom{width:min(42px,calc((100% - 36px) / 7))}
.t42table{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:". n ." "w c e" ". s .";gap:2px 4px;padding:10px 6px}
.t42seat{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:12px;padding:5px 2px;min-width:0;transition:background .2s,box-shadow .2s}
.t42seat.n{grid-area:n}.t42seat.w{grid-area:w}.t42seat.e{grid-area:e}.t42seat.s{grid-area:s}
.t42seat.on{background:#fff9ee;box-shadow:0 0 0 2.5px var(--orange)}
.t42seat .nm{font-weight:700;color:var(--plum);font-size:13px;display:flex;align-items:center;gap:3px;white-space:nowrap;max-width:100%;overflow:hidden}
.t42seat .nm svg{width:13px;height:13px;opacity:.7;flex:0 0 auto}
.t42seat .nm .dealer{margin-left:3px}
.t42seat .meta{font-size:11px;color:var(--muted);min-height:14px}
.t42seat .meta b{color:var(--plum)}
.t42seat .slot{margin-top:4px;min-height:72px;display:flex;align-items:center;justify-content:center}
.t42seat .slot .dom{width:34px}
.t42seat .slot .dom.xs{width:9px}
.t42seat .backs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:80px}
.bidgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.bidgrid .btn{min-height:40px;padding:6px;font-size:14px}
.bidgrid .wide2{grid-column:span 2}
.bidtag{display:inline-grid;place-items:center;min-width:36px;height:24px;border:2px solid var(--plum);border-radius:7px;font-weight:700;font-size:12.5px;color:var(--plum);padding:0 5px}
.bidtag.f{background:var(--plum);color:#fff}
.bidtag.d{border-style:dashed;opacity:.7}
.mini.md svg{width:38px;height:19px}


/* ===== Table games (scoped under .tg) ===== */
.tg .sheet{max-width:560px;margin:0 auto;background:#fff;border:2px solid var(--plum);border-radius:22px;
  box-shadow:0 0 0 5px #fff,0 0 0 6.5px var(--line);padding:22px 18px 18px;position:relative;min-height:calc(100vh - 40px)}
@media (min-width:600px){.tg .sheet{padding:28px 28px 24px;margin-top:10px}}
.tg .label{color:var(--label);font-weight:600;font-size:14px;letter-spacing:.01em;margin:0 0 2px}
.tg .title{color:var(--plum);font-weight:700;font-size:clamp(40px,12.5vw,60px);line-height:.98;letter-spacing:-.025em;margin:0}
.tg .title.sm{font-size:clamp(30px,9vw,42px)}
.tg .tagline{font-weight:600;color:var(--ink);margin:8px 0 0;font-size:15px}
.tg .head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.tg .head .art{flex:0 0 auto;width:112px;margin-top:-2px}
.tg .head .art svg{width:100%;height:auto;display:block}
.tg .info{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--plum);border-bottom:2px solid var(--plum);margin:14px 0 18px;padding:9px 0}
.tg .info>div{display:flex;gap:7px;align-items:flex-start;padding:0 8px;border-left:2px dashed #b9a2b8;min-width:0}
.tg .info>div:first-child{border-left:0;padding-left:2px}
.tg .info svg{flex:0 0 22px;width:22px;height:22px;margin-top:1px}
.tg .info b{display:block;color:var(--plum);font-weight:700;font-size:13.5px;line-height:1.15}
.tg .info span{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;margin-top:1px}
.tg .sec{display:flex;align-items:center;gap:9px;margin:20px 0 10px;color:var(--plum);font-weight:700;font-size:21px;letter-spacing:-.01em}
.tg .sec .n{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;background:var(--orange)}
.tg .sec .n.p{background:var(--plum)}
.tg .sec .right{margin-left:auto;font-size:13px;font-weight:600}
.tg .panel{background:var(--sand);border-radius:18px;padding:14px}
.tg .panel.lite{background:var(--sand2)}
.tg .panel h3{margin:0 0 8px;color:var(--plum);font-size:15px}
.tg .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--plum);background:#fff;color:var(--plum);
  border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;min-height:46px;transition:transform .08s,background .15s;text-decoration:none}
.tg .btn:active{transform:scale(.97)}
.tg .btn.primary{background:var(--plum);color:#fff}
.tg .btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.tg .btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.tg .btn.ghost{border-color:transparent;background:transparent}
.tg .btn[disabled]{pointer-events:none;background:transparent;color:rgba(78,31,77,.42);border-color:rgba(78,31,77,.28);border-style:dashed}
.tg .btn.wide{width:100%}
.tg .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg .btns>.btn{flex:1 1 0;min-width:120px}
.tg .btn>svg{width:19px;height:19px;flex:0 0 auto}
.tg .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg .tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--plum);border-radius:16px;padding:12px;min-height:150px;position:relative;transition:transform .1s,box-shadow .15s}
.tg .tile:active{transform:scale(.98)}
.tg .tile:hover{box-shadow:4px 4px 0 var(--sand)}
.tg .tile .ic{height:46px;margin-bottom:8px}
.tg .tile .ic svg{height:46px;width:auto}
.tg .tile b{color:var(--plum);font-size:17px;line-height:1.1;font-weight:700}
.tg .tile small{color:var(--ink);font-size:12.5px;margin-top:4px;line-height:1.25}
.tg .tile .pp{margin-top:auto;padding-top:8px;color:var(--muted);font-size:11.5px}
.tg .tile .resume{position:absolute;top:-9px;right:8px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.tg .banner{background:var(--plum);color:#fff;border-radius:16px;padding:16px 18px;margin-top:20px;display:flex;align-items:center;gap:12px}
.tg .banner .t{font-weight:700;font-size:22px;line-height:1.15}
.tg .banner .t em{font-style:normal;color:var(--gold)}
.tg .banner .s{color:#f6c98a;font-size:13px;margin-top:4px}
.tg .banner .ic{margin-left:auto;flex:0 0 46px}
.tg .banner .ic svg{width:46px;height:auto}
.tg .modes{display:grid;gap:8px}
.tg .mode{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--plum);background:#fff;border-radius:16px;padding:10px 12px}
.tg .mode .mi{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--sand2);display:grid;place-items:center}
.tg .mode .mi svg{width:26px;height:26px}
.tg .mode b{display:block;color:var(--plum);font-size:15.5px}
.tg .mode span{display:block;font-size:12.5px;color:var(--ink);line-height:1.25}
.tg .mode.on{background:var(--sand);box-shadow:0 0 0 3px var(--orange)}
.tg .mode.on .mi{background:#fff}
.tg .prow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tg .prow .dot{flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--plum)}
.tg .prow input{flex:1 1 120px;min-width:0;border:2px solid var(--plum);border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;color:var(--plum);background:#fff}
.tg .prow input:focus{outline:3px solid var(--sand)}
.tg .seg{display:inline-flex;border:2px solid var(--plum);border-radius:999px;overflow:hidden;flex:0 0 auto}
.tg .seg button{border:0;background:#fff;color:var(--plum);padding:8px 10px;font-weight:600;font-size:12.5px}
.tg .seg button.on{background:var(--plum);color:#fff}
.tg .seg button+button{border-left:2px solid var(--plum)}
.tg .x{border:0;background:transparent;color:var(--muted);font-size:22px;width:34px;height:34px;border-radius:50%;flex:0 0 34px}
.tg .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;flex-wrap:wrap}
.tg .opt+.opt{border-top:2px dashed rgba(78,31,77,.25)}
.tg .opt .l b{display:block;color:var(--plum)}
.tg .opt .l span{font-size:12.5px;color:var(--ink)}
.tg .note{font-size:13px;color:var(--muted);margin:6px 0 0}
.tg .sheet.play{padding:10px 10px 10px;min-height:0;height:calc(100vh - 34px);height:calc(100dvh - max(10px,env(safe-area-inset-top)) - max(16px,env(safe-area-inset-bottom)) - 8px);display:flex;flex-direction:column}
.tg .bar{display:flex;align-items:center;gap:6px;margin:0 0 6px}

<script>
/* ===== Table games (Toad, Sjoelbak, Shuffleboard, Bank Shot, Curling, Shove Ha'penny) ===== */
(function () {
'use strict';

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DEG = Math.PI / 180;
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function listAnd(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
const QS = new URLSearchParams(location.search);
let SPEED = +(QS.get('speed') || 1);

const store = {
  get(k, d) { try { const v = localStorage.getItem('ptg.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ptg.' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('ptg.' + k); } catch (e) { } }
};

/* ---------- sound (tiny synth, starts on first touch) ---------- */
const Sound = {
  ctx: null, on: store.get('sound', true), last: 0, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C();
      const n = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.2, this.ctx.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      this.noise = n;
    } catch (e) { this.ctx = null; }
  },
  toggle() { this.on = !this.on; store.set('sound', this.on); },
  _env(node, t, a, len) { const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + len); node.connect(g); g.connect(this.ctx.destination); return g; },
  clack(v, tone = 2400) {
    if (!this.on || !this.ctx || v < 40) return; const t = this.ctx.currentTime; if (t - this.last < 0.035) return; this.last = t;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = tone; f.Q.value = 4;
    s.connect(f); this._env(f, t, clamp(v / 1400, 0.04, 0.7), 0.07); s.start(t); s.stop(t + 0.1);
  },
  thud(a = 0.4) {
    if (!this.on || !this.ctx) return; const t = this.ctx.currentTime, o = this.ctx.createOscillator();
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12); this._env(o, t, a, 0.16); o.start(t); o.stop(t + 0.2);
  },
  chime(up = true) {
    if (!this.on || !this.ctx) return; const t = this.ctx.currentTime;
    (up ? [660, 990] : [440, 330]).forEach((fq, i) => { const o = this.ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = fq; this._env(o, t + i * 0.09, 0.18, 0.3); o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.35); });
  },
  slide() {
    if (!this.on || !this.ctx) return; const t = this.ctx.currentTime, s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; s.connect(f); this._env(f, t, 0.05, 0.18); s.start(t); s.stop(t + 0.2);
  }
};

/* ---------- colours used on the tables ---------- */
const COL = {
  plum: '#4e1f4d', plum2: '#6a3468', soft: '#efe3ef', sand: '#f8dca8', sand2: '#fbeacb', orange: '#dd7f27', gold: '#f2a91f', ink: '#3b3b3b',
  side: [{ top: '#e88a33', edge: '#b0601b', name: 'Orange' }, { top: '#7a3f78', edge: '#3d163c', name: 'Plum' }]

  shove: `<svg viewBox="0 0 64 48"><path d="M10 6h44v38H10z" fill="#f8dca8" ${S}/><path d="M17 6v38M47 6v38" stroke="#4e1f4d" stroke-width="1.6"/><path d="M10 14h44M10 19h44M10 24h44M10 29h44M10 34h44" stroke="#4e1f4d" stroke-width="1.3"/><circle cx="29" cy="21.5" r="3.6" fill="#c8803e" ${S}/><circle cx="38" cy="40" r="4" fill="#c8803e" ${S}/><path d="M12.5 15.5v2M14 15.5v2" stroke="#fff" stroke-width="1.3"/></svg>`,
  people: `<svg viewBox="0 0 24 24" fill="none" ${S}><circle cx="9" cy="8" r="3.4"/><path d="M3 20c.6-3.6 3-5.6 6-5.6s5.4 2 6 5.6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6.1 4.4 1.8 5 4.6"/></svg>`,

   Sjoelbak (Dutch shuffleboard)

function sjoelScore(c) { const s = Math.min(...c); return 20 * s + 2 * (c[0] - s) + 3 * (c[1] - s) + 4 * (c[2] - s) + 1 * (c[3] - s); }

function sjoelPiles(n) { const p = []; if (n > 0) { p.push(Math.min(4, n)); for (n -= p[0]; n > 0; n -= 3) p.push(Math.min(3, n)); } return p; }

/* =========================================================
   Shuffleboard (table) and Bank Shot (rebound) shuffleboard
   ========================================================= */
function puckLook(b) { const c = COL.side[b.side || 0]; return { top: c.top, edge: c.edge, ring: b.side ? 'rgba(248,220,168,.55)' : 'rgba(255,255,255,.45)' }; }

class ShuffleTable extends SlideTable {
  init() {
    const L = this.L = 3660; this.W2 = 508; this.R = 29; this.foul = L - 1830; this.l2 = L - 305; this.l3 = L - 152;
    this.startY = 110; this.th = 16; this.vmax = 1950; this.aimLen = 1100; this.maxAng = 5 * DEG; this.decel = 420;
    this.world = new World({ decel: this.decel, e: 0.88 });
    this.order = []; const h = this.unit.hammer; for (let i = 0; i < 4; i++) this.order.push(1 - h, h); this.thrown = 0;
  }
  look(b) { return puckLook(b); }
  xRange() { const h = this.W2 / 2 - this.R - 3; return [-h, h]; }
  nextShooter() { if (this.thrown >= 8) return null; const side = this.order[this.thrown], p = this.m.players[side]; return { side, cpu: p.kind === 'cpu', name: p.name }; }
  launch(w, s, sh) { const sp = this.vmax * Math.sqrt(s.pow); return w.add({ x: s.x, y: this.startY, r: this.R, vx: Math.sin(s.ang) * sp, vy: Math.cos(s.ang) * sp, side: sh.side }); }
  onShot() { this.thrown++; }
  hook(w, b) { if (b.y > this.L || Math.abs(b.x) > this.W2 / 2) { b.out = 'off'; if (!w.sim) { b.fall = 0; Sound.thud(0.2); } } }
  rest(w, live) { for (const b of w.bodies) if (!b.out && b.y - b.r < this.foul) { b.out = 'short'; if (live) b.fade = 0; } }
  val(b) { if (b.y + b.r > this.L) return 4; if (b.y - b.r >= this.l3) return 3; if (b.y - b.r >= this.l2) return 2; return 1; }
  depth(b) { return b.y; }
  score(w) { return sideScore(w.bodies.filter(b => !b.out), b => this.val(b), b => this.depth(b)); }
  result() { const s = this.score(this.world); return { side: s.side, pts: s.pts }; }
  status() {
    const sh = this.shooter; if (!sh) return ['', ''];
    const mine = Math.floor((this.thrown) / 2) + 1, s = this.score(this.world);
    const lie = s.side >= 0 ? `${this.m.players[s.side].name} lying ${s.pts}` : 'Nobody lying yet';
    return [`${sh.name}'s shot`, `Puck ${Math.min(4, mine)} of 4 · ${lie}`];
  }
  tipText() { return 'Touch where to shoot from, pull back, let go'; }
  camPresets(W, H) {
    const hw = this.W2 / 2, L = this.L;
    return {
      aim: fitCam([0, -1000, 1250], [0, L * 0.58, 0], rectPts(-hw - 70, -60, hw + 70, L + 110), { x: 14, y: 10, w: W - 28, h: H * 0.8 - 10 }),
      watch: fitCam([0, L - 1650, 1250], [0, L - 300, 0], rectPts(-hw - 70, this.foul + 500, hw + 70, L + 110), { x: 14, y: 12, w: W - 28, h: H - 24 }),
      inset: Object.assign(fitCam([0, L - 900, 1500], [0, L - 250, 0], rectPts(-hw - 30, L - 640, hw + 30, L + 90), { x: W * 0.64, y: 8, w: W * 0.36 - 8, h: H * 0.3 }), { label: 'FAR END' })
    };
  }
  drawTable(g) {
    const c = this.cam, L = this.L, hw = this.W2 / 2;
    gfill(g, c, rectPts(-hw - 70, -60, hw + 70, L + 110), COL.plum);
    gfill(g, c, rectPts(-hw - 8, -10, hw + 8, L + 8), '#2e0f2d');
    gfill(g, c, rectPts(-hw, 0, hw, L), COL.sand);
    for (let x = -hw + 45; x < hw; x += 64) gvbar(g, c, x, 0, L, 2, 'rgba(176,96,27,.09)');
    gfill(g, c, rectPts(-hw, this.l3, hw, L), '#f4c27e'); gfill(g, c, rectPts(-hw, this.l2, hw, this.l3), '#fae6c2');
    gfill(g, c, rectPts(-hw, 0, hw, 152), 'rgba(244,194,126,.45)'); gfill(g, c, rectPts(-hw, 152, hw, 305), 'rgba(250,230,194,.5)');
    gbar(g, c, -hw, hw, this.foul, 9, COL.orange); gbar(g, c, -hw, hw, this.l2, 6, COL.plum); gbar(g, c, -hw, hw, this.l3, 6, COL.plum);
    gbar(g, c, -hw, hw, 1830, 5, 'rgba(78,31,77,.25)'); gbar(g, c, -hw, hw, 305, 4, 'rgba(78,31,77,.25)'); gbar(g, c, -hw, hw, 152, 4, 'rgba(78,31,77,.25)');
    gtext(g, c, '1', 0, this.l2 - 300, 190, COL.plum, { a: 0.5 }); gtext(g, c, '2', 0, (this.l2 + this.l3) / 2, 115, COL.plum, { a: 0.6 }); gtext(g, c, '3', 0, (this.l3 + L) / 2, 115, COL.plum, { a: 0.6 });
    gtext(g, c, 'FOUL LINE', 0, this.foul - 55, 48, COL.orange, { a: 0.9 }); gtext(g, c, '4 HANGING OVER', 0, L + 62, 38, COL.sand, { a: 0.9 });
  }
  async plan() {
    const me = this.shooter.side, a = this.decel, C = [], L = this.L;
    const powFor = d => clamp(Math.pow(Math.sqrt(2 * a * Math.max(20, d - this.startY)) / this.vmax, 2), 0.02, 1);
    for (const x of [-150, -75, 0, 75, 150]) for (const d of [L - 50, L - 110, L - 220, L - 420, L - 900, L + 6]) for (const an of [0, -0.35, 0.35]) C.push({ x, ang: an * DEG, pow: powFor(d) });
    for (const b of this.world.bodies) if (!b.out && b.side !== me) for (const x of [-170, -85, 0, 85, 170]) {
      const ang = Math.atan2(b.x - x, b.y - this.startY); if (Math.abs(ang) < this.maxAng) for (const p of [0.8, 0.92, 1]) C.push({ x, ang, pow: p });
    }
    const ev = w => { const s = this.score(w); return s.side === me ? s.pts : s.side >= 0 ? -s.pts : 0; };
    const r = await this.search(C, ev, 520); if (!r) return null; return await this.refine(r.best, r.v, ev, 18);
  }
}

class BankTable extends ShuffleTable {
  init() {
    this.L = 2100; this.W2 = 1000; this.R = 29; this.startY = 90; this.th = 16; this.vmax = 3000; this.aimLen = 650; this.maxAng = 24 * DEG; this.decel = 420;

    const e = 0.8, tf = 0.97, W = 500, cr = 250, cy = this.L - cr;
    const walls = [wallSeg(-W, 0, -W, cy, e, tf), wallSeg(W, 0, W, cy, e, tf), wallSeg(-cr, this.L, cr, this.L, e, tf),
      ...arcWalls(-W + cr, cy, cr, Math.PI, Math.PI / 2, 10, e, tf), ...arcWalls(W - cr, cy, cr, Math.PI / 2, 0, 10, e, tf),
      ...boxWalls(-15, -40, 15, this.div, 0.7, 0.97)];
    this.world = new World({ decel: this.decel, e: 0.88, walls });

  }

  hook(w, b) { if (b.y < 0 || b.y > this.L + 50 || Math.abs(b.x) > 560) { b.out = 'off'; if (!w.sim) { b.fall = 0; Sound.thud(0.2); } } }
  rest(w, live) { for (const b of w.bodies) if (!b.out && (b.x < 15 || b.y + b.r > this.first)) { b.out = 'dead'; if (live) b.fade = 0; } }
  val(b) { const f = b.y + b.r; return f <= 150 ? 4 : f <= 300 ? 3 : f <= 450 ? 2 : f <= 600 ? 1 : 0; }
  depth(b) { return -b.y; }
  tipText() { return 'Bank it off the back cushion: aim up and to the right'; }
  camPresets(W, H) {
    const p = fitCam([0, -1150, 2100], [0, 1050, 0], rectPts(-560, -50, 560, this.L + 60), { x: 12, y: 10, w: W - 24, h: H * 0.84 - 10 });
    return { aim: p, watch: p };
  }
  outline(o) { // playfield boundary, grown by o mm
    const W = 500 + o, cr = 250 + o, cy = this.L - 250, pts = [[-W, -o * 0.6], [-W, cy]];
    for (let i = 1; i <= 10; i++) { const t = Math.PI - i / 10 * Math.PI / 2; pts.push([-250 + cr * Math.cos(t), cy + cr * Math.sin(t)]); }
    for (let i = 0; i <= 10; i++) { const t = Math.PI / 2 - i / 10 * Math.PI / 2; pts.push([250 + cr * Math.cos(t), cy + cr * Math.sin(t)]); }
    pts.push([W, -o * 0.6]); return pts;
  }
  drawTable(g) {
    const c = this.cam;
    gfill(g, c, this.outline(55), COL.plum); gfill(g, c, this.outline(0), COL.sand);
    for (let x = -460; x < 500; x += 70) gvbar(g, c, x, 0, this.L - (Math.abs(x) > 250 ? 250 - Math.sqrt(Math.max(0, 250 * 250 - Math.pow(Math.abs(x) - 250, 2))) : 0), 2, 'rgba(176,96,27,.08)');
    gfill(g, c, rectPts(15, 0, 500, 150), '#f4c27e'); gfill(g, c, rectPts(15, 150, 500, 300), '#f7d49e'); gfill(g, c, rectPts(15, 300, 500, 450), '#fae6c2');
    for (const y of this.lines) gbar(g, c, 15, 500, y, 6, COL.plum); gbar(g, c, 15, 500, this.first, 9, COL.orange);
    [['4', 75], ['3', 225], ['2', 375], ['1', 525]].forEach(([t, y]) => gtext(g, c, t, 258, y, 92, COL.plum, { a: 0.62 }));
    gtext(g, c, 'FIRST LINE', 258, this.first + 50, 40, COL.orange, { a: 0.9 });
    dashLine(g, c, [[-300, 420], [-300, 1650], [-150, 1980], [150, 1980], [300, 1650], [300, 760]], 'rgba(78,31,77,.18)', 3, [4, 9]);
    gtext(g, c, 'SHOOT UP', -258, 360, 46, COL.plum, { a: 0.45 }); gtext(g, c, 'THE BEND', 0, this.L - 130, 46, COL.plum, { a: 0.4 });
    gfill(g, c, rectPts(-15, -30, 15, this.div), COL.plum); gfill(g, c, circPts(0, this.div, 15, 16), COL.plum);
  }

    const me = this.shooter.side, C = [];
    for (const x of [-420, -330, -240, -150, -70]) for (let a = 1; a <= 22; a += 2.2) for (let p = 0.3; p <= 0.98; p += 0.085) C.push({ x, ang: a * DEG, pow: p });
    C.sort(() => Math.random() - 0.5);
    const ev = w => { const s = this.score(w); return s.side === me ? s.pts : s.side >= 0 ? -s.pts : 0; };
    const r = await this.search(C, ev, 700); if (!r) return null; return await this.refine(r.best, r.v, ev, 28, 0.8 * DEG, 0.03, 10);
  }
}

/* =========================================================
   Shove ha'penny
   ========================================================= */
function shoveMarks(beds, me, list, per) {
  const b = [beds[0].slice(), beds[1].slice()], o = 1 - me, log = [];
  for (const k of list) {
    if (b[me].every(v => v >= per)) { log.push({ k, to: -1 }); continue; }
    if (b[me][k] < per) { b[me][k]++; log.push({ k, to: me }); }
    else if (b[o][k] < per) {
      const theirLast = b[o].every((v, i) => (i === k ? v + 1 >= per : v >= per));
      if (theirLast) log.push({ k, to: -1, why: 'last' }); else { b[o][k]++; log.push({ k, to: o }); }
    } else log.push({ k, to: -1 });
  }
  return { b, log, win: b[me].every(v => v >= per) };
}

  init(m) { m.s = { beds: [Array(9).fill(0), Array(9).fill(0)], cur: resolveFirst(m, m.opts.first), log: [] }; },
  unit(m) { const s = m.s, left = s.beds[s.cur].filter(v => v < m.opts.per).length; return { who: s.cur, title: `${rname(m, s.cur)}'s turn`, sub: `${plural(left, 'bed')} still to fill` }; },
  apply(m, res) {
    const s = m.s, me = s.cur, r = shoveMarks(s.beds, me, res.beds, m.opts.per); s.beds = r.b;
    const mine = r.log.filter(l => l.to === me).map(l => l.k + 1), gift = r.log.filter(l => l.to === 1 - me).map(l => l.k + 1);
    s.log.push({ who: me, beds: res.beds.map(k => k + 1), mine, gift, where: res.where });
    if (r.win) { m.over = true; m.winner = [me]; }
    s.cur = 1 - me;
    let t = mine.length ? `${rname(m, me)} chalks up ${listAnd(mine.map(String))}` : `${rname(m, me)}: nothing in a bed`;
    if (mine.length > 1) t = `${rname(m, me)} chalks up beds ${listAnd(mine.map(String))}`; else if (mine.length) t = `${rname(m, me)} chalks up bed ${mine[0]}`;
    return { t, s: gift.length ? `Bed ${listAnd(gift.map(String))} was full, so ${rname(m, 1 - me)} gets it` : '' };
  },
  chips(m) { return [0, 1].map(i => { const f = m.s.beds[i].filter(v => v >= m.opts.per).length; return { name: m.players[i].name, v: f, small: '/9 beds', sub: `${m.s.beds[i].reduce((a, b) => a + b, 0)} marks`, on: !m.over && m.s.cur === i }; }); },
  chalk(m, beds, prov, tapSide) {
    const per = m.opts.per, cell = (side, k) => {
      const n = (prov || beds)[side][k], had = beds[side][k];
      return [...Array(Math.min(n, per))].map((_, j) => `<span class="m ${j >= had ? 'new' : ''}"></span>`).join('') || `<span class="sl">·</span>`;
    };
    let h = `<div class="chalk"><div class="hd ${m.s.cur === 0 ? 'on' : ''}">${pname(m, 0)}</div><div class="hd">Bed</div><div class="hd ${m.s.cur === 1 ? 'on' : ''}">${pname(m, 1)}</div>`;
    for (let k = 8; k >= 0; k--) {
      const full = s => (prov || beds)[s][k] >= per ? ' full' : '';
      const tag = tapSide != null ? `button data-tg="e:bed:${k}"` : 'div';
      h += `<${tag} class="bed${full(0)}${tapSide != null ? ' tap' : ''}">${cell(0, k)}</${tag.split(' ')[0]}><${tag} class="bed num${tapSide != null ? ' tap' : ''}">${k + 1}</${tag.split(' ')[0]}><${tag} class="bed${full(1)}${tapSide != null ? ' tap' : ''}">${cell(1, k)}</${tag.split(' ')[0]}>`;
    }
    return h + `</div>`;
  },
  board(m) {
    const log = m.s.log.slice(-8).reverse().map(l => `<div>${pname(m, l.who)}: ${l.mine.length ? 'bed ' + l.mine.join(', ') : 'no score'}${l.gift.length ? ` · gave bed ${l.gift.join(', ')}` : ''}</div>`).join('');
    return this.chalk(m, m.s.beds) + `<p class="note">Bed 1 is nearest the player. Three marks fill a bed${m.opts.per === 1 ? ' (one in the quick game)' : ''}. Once yours is full, more scores there go to the other side, but never their last one.</p>${log ? `<div class="log">${log}</div>` : ''}`;
  },
  entryInit() { return { list: [] }; },
  entryHTML(m, st, u) {
    const r = shoveMarks(m.s.beds, u.who, st.list.slice().sort((a, b) => a - b), m.opts.per);
    const gift = r.log.filter(l => l.to === 1 - u.who).length;
    return `<div class="panel lite" style="margin-bottom:10px"><h3>${pname(m, u.who)}: tap a bed for each coin that's fully in it</h3>

    ${this.chalk(m, m.s.beds, r.b, u.who)}

  },
  entryAct(m, st, a, v) {
    if (a === 'bed' && st.list.length < 5) st.list.push(+v); else if (a === 'pop') st.list.pop();

  },
  rules: {
    s1: ['Play a turn', [['Set a coin at the front edge.', 'Just over the lip, nearest you.'], ['Shove it up the board', 'with the heel of your hand.'], ['Play all five.', 'Knocking earlier coins on is fair play.'], ['Score when all five stop.', 'Chalk up, gather the coins, pass them on.']]],
    s2: ['Scoring', [[1, 'mark', 'Wholly inside a bed'], [0, 'marks', 'Touching a line'], [0, 'marks', 'Off the board']], ['Coins in beds 2, 2 and 5', '= 2 marks in bed 2, 1 in bed 5'], 'Each bed is the strip between two lines.'],
    s3: ['Fill the beds', 'Three marks fill a bed. Then what?', ['Another score in a full bed', 'Goes to'], [['Your bed is full', 'The mark goes to them instead.', 'Them'], ['Theirs is full too', 'Nobody gets it.', '—'], ['It would be their last mark', 'Never given away. They must score it.', '—']]],
    s4: ['Good to know', [['Too short', 'Didn’t reach the first line? It doesn’t count as played. Shove it again.'], ['Off', 'Off the end or the side? Dead for this turn.'], ['Careful', 'Filling a bed too early hands spare scores to them.']]],
    banner: ['First to fill all <em>nine</em> beds wins!', 'Quick game? One mark fills a bed.']
  },
  appNotes: ['Chalk marks show on the sides of the board as you play: gold ones are this turn’s.', 'Gifts to the other side are worked out for you, including the never-their-last-mark rule.']

const CPU_NAMES = ['Hamish', 'Fiona', 'Angus', 'Isla', 'Rab', 'Kirsty'];
const isCpuName = n => n === 'Computer' || CPU_NAMES.includes(n);
const cpuName = i => CPU_NAMES[Math.max(0, i - 1) % CPU_NAMES.length];
function humanName(i) {

}
const ORDER = ['toad', 'sjoel', 'shuffle', 'bank', 'curling', 'shove'];

  ? 'Some play the real board, some play on the phone, all on one scoreboard. Set each player below.'

    this.R().innerHTML = `<div class="sheet">
      <div class="bar"><button class="iconbtn" data-tg="home" aria-label="Back to all games">${ICON.back}Games</button><span class="nm"></span><button class="iconbtn" data-tg="rules:${G.id}">${ICON.book} Rules</button></div>
      <div class="head"><div><p class="label">Pub games night</p><h1 class="title sm">${G.name}</h1><p class="tagline">${G.tag}</p></div><div class="art">${G.icon}</div></div>
      <div class="info">${G.info.map(([ic, b, s]) => `<div>${ICON[ic]}<p style="margin:0"><b>${b}</b><span>${s}</span></p></div>`).join('')}</div>
      ${live && !live.over ? `<div class="panel" style="margin-bottom:6px"><h3>Game in progress</h3><p class="note" style="margin:0 0 8px;color:var(--ink)">${live.players.map((p, i) => esc(p.name) + ': ' + GAMES[G.id].chips(live)[i].v).join(' · ')}. Starting a new game replaces it.</p><div class="btns" style="margin-top:0"><button class="btn primary" data-tg="resume">Carry on</button></div></div>` : ''}
      <div class="sec"><span class="n">1</span>How are you playing?</div>
      <div class="modes">${['app', 'real', 'hybrid'].map(k => `<button class="mode ${mode === k ? 'on' : ''}" data-tg="mode:${k}"><span class="mi">${ICON[MODES[k].ic]}</span><span><b>${MODES[k].n}</b><span>${k === 'hybrid' ? hybridText(G) : MODES[k].d}</span></span></button>`).join('')}</div>
      <div class="sec"><span class="n">2</span>${G.seat.label}${G.seat.max > 2 && st.players.length < G.seat.max ? `<button class="btn small right" data-tg="addp">+ Add</button>` : ''}</div>

  /* ---------- match ---------- */
  startMatch() {
    const G = this.G, st = this.setup, mode = st.mode, rounds = G.kind === 'rounds';

      if (rounds) return { name, kind: 'human', where: 'real' };
      return { name, kind: p.where === 'cpu' ? 'cpu' : 'human', where: p.where === 'cpu' ? 'app' : p.where };
    });
    if (!G.seat.names) { const names = store.get('names', []); players.forEach((p, i) => { if (p.kind === 'human' && !isCpuName(p.name)) names[i] = p.name; }); store.set('names', names); if (window.PubHome && players[0].kind === 'human') try { localStorage.setItem('pubgames.firstName', JSON.stringify(players[0].name)); } catch (e) { } }
    const m = { gid: G.id, mode, players, opts: Object.assign({}, st.opts), diff: st.diff, hist: [], over: false, winner: null, t: Date.now() };

  },
  save() { if (this.m) store.set('match.' + this.m.gid, this.m); },
  resume() { const m = store.get('match.' + this.G.id, null); if (!m) return; this.m = m; this.nextUnit(); },
  whereFor(u) {
    const m = this.m; if (m.mode === 'real') return 'real'; if (m.mode === 'app') return 'app';

  },
  nextUnit() {
    const m = this.m; if (m.over) return this.finish();
    const u = this.G.unit(m); this.unit = u; const w = this.whereFor(u);
    if (!w) return this.askWhere(u);

  },
  startUnit(u, where) {
    this.stopTable(); this.closeOv(); this.where = where; const G = this.G, m = this.m;
    const realPill = m.mode === 'hybrid' ? `<div class="side"><span class="pill">${where === 'real' ? 'Real table' : 'In the app'}</span></div>` : '';
    this.R().innerHTML = `<div class="sheet play">
      <div class="bar"><button class="iconbtn" data-tg="quit" aria-label="Leave">${ICON.close}</button><span class="nm">${G.short}</span>
      <button class="iconbtn" data-tg="sound" aria-label="Sound">${Sound.on ? ICON.sound : ICON.mute}</button><button class="iconbtn" data-tg="rules:${G.id}" aria-label="Rules">${ICON.book}</button><button class="iconbtn" data-tg="board">${ICON.list} Score</button></div>
      <div class="chips" id="chips"></div>
      ${where === 'real' ? `<div class="entry" id="entry"></div>` : `<div class="stage" id="stage"><div class="tip hide" id="tip"></div><div class="flash" id="flash"></div>${realPill}</div>`}
      <div class="ctrl"><div class="status" id="status"></div><div class="tools" id="tools"></div>${this.swapHTML(u, where)}</div></div>`;

    else { this.table = new G.Table({ match: m, unit: u, game: G, ui: this.ui, onDone: r => this.commit(r, 'app') }); this.table.mount($('#stage')); }
  },
  swapHTML(u, where) {

    if (this.G.kind === 'turns') { const p = m.players[u.who]; if (p.kind === 'cpu') return ''; return `<p class="swap">${where === 'real' ? `${esc(p.name)} on the real board. <button data-tg="swap">Play this turn in the app</button>` : `<button data-tg="swap">Switch ${esc(p.name)} to the real board</button>`}</p>`; }
    return `<p class="swap"><button data-tg="swap">Play this round ${where === 'real' ? 'in the app' : 'on the real table'} instead</button></p>`;
  },
  renderEntry() { const el = $('#entry'); if (!el) return; el.innerHTML = this.G.entryHTML(this.m, this.est, this.unit) + (this.m.hist.length ? `<p class="swap"><button data-tg="undo">Undo the last score</button></p>` : ''); },
  renderChips() {
    const el = $('#chips'); if (!el || !this.m) return; let cs = this.G.chips(this.m);
    if (this.table && this.table.shooter && this.G.kind === 'rounds') cs = cs.map((c, i) => Object.assign({}, c, { on: i === this.table.shooter.side }));
    el.innerHTML = cs.map(c => `<div class="chip ${c.on ? 'on' : ''}">${c.tag ? `<span class="tag ${c.on ? '' : 'p'}">${c.tag}</span>` : ''}<div class="who">${c.dot != null ? dotHTML(c.dot) : ''}${esc(c.name)}</div><div class="v">${c.v}<small>${c.small || ''}</small></div><div class="sub">${c.sub || ''}</div></div>`).join('');
  },
  commit(res, where) {

    m.hist.push(JSON.stringify({ s: m.s, over: m.over, winner: m.winner })); if (m.hist.length > 80) m.hist.shift();
    res.where = where; const msg = G.apply(m, res); this.save(); this.stopTable();

  undo() {
    const m = this.m; if (!m || !m.hist.length) return; const h = JSON.parse(m.hist.pop());
    m.s = h.s; m.over = h.over; m.winner = h.winner; this.save(); this.toast('Last score undone'); this.closeOv(); this.nextUnit();
  },
  between(msg) {
    const m = this.m, u = this.G.unit(m), nextP = u.who != null ? m.players[u.who] : null;
    this.openOv(`<div class="win"><h2>${esc(msg.t)}</h2>${msg.s ? `<p>${esc(msg.s)}</p>` : ''}</div>
      <div class="chips" style="margin-top:12px">${this.G.chips(m).map(c => `<div class="chip ${c.on ? 'on' : ''}"><div class="who">${c.dot != null ? dotHTML(c.dot) : ''}${esc(c.name)}</div><div class="v">${c.v}<small>${c.small || ''}</small></div><div class="sub">${c.sub || ''}</div></div>`).join('')}</div>
      <div class="panel lite" style="margin-top:10px"><h3>Next up: ${esc(u.title)}</h3><p class="note" style="margin:0">${esc(u.sub)}${nextP && nextP.kind === 'human' && m.players.filter(p => p.kind === 'human').length > 1 && m.mode !== 'real' ? ' · pass the phone' : ''}</p></div>
      <div class="btns"><button class="btn" data-tg="board">${ICON.list} Scoreboard</button><button class="btn primary" data-tg="cont">Carry on</button></div>`, false);
  },
  askWhere(u) {
    this.stopTable(); const G = this.G;
    this.R().innerHTML = `<div class="sheet play"><div class="bar"><button class="iconbtn" data-tg="quit">${ICON.close}</button><span class="nm">${G.short}</span><button class="iconbtn" data-tg="board">${ICON.list} Score</button></div><div class="chips" id="chips"></div>
      <div class="entry"><div class="sec"><span class="n">?</span>${esc(u.title)}: where are you playing it?</div><p class="note" style="margin-top:-4px">${esc(u.sub)}</p>
      <div class="where"><button class="mode" data-tg="pick:real"><span class="mi">${ICON.pencil}</span><span><b>On the real table</b><span>Play it, then tap in who scored.</span></span></button>
      <button class="mode" data-tg="pick:app"><span class="mi">${ICON.phone}</span><span><b>In the app</b><span>Play the round on the phone. Pass it between shots.</span></span></button></div>
      ${this.m.hist.length ? `<p class="swap"><button data-tg="undo">Undo the last score</button></p>` : ''}</div></div>`;
    this.renderChips();
  },
  finish(msg) {
    const m = this.m, G = this.G, names = (m.winner || []).map(i => m.players[i].name);
    store.del('match.' + m.gid);
    const title = names.length > 1 ? `${listAnd(names.map(esc))} share it!` : `${esc(names[0] || 'Nobody')} wins!`;
    this.R().innerHTML = `<div class="sheet"><div class="bar"><button class="iconbtn" data-tg="home">${ICON.back}</button><span class="nm">${G.short}</span><span style="width:36px"></span></div>
      <div class="win"><div class="crown">${ICON.crown}</div><h2>${title}</h2>${msg ? `<p>${esc(msg.t)}${msg.s ? ' · ' + esc(msg.s) : ''}</p>` : ''}</div>
      <div class="sec"><span class="n p">${ICON.list.replace('<svg', '<svg style="width:16px;height:16px;stroke:#fff"').replace(/stroke="#4e1f4d"/g, 'stroke="#fff"')}</span>Final scores</div>${G.board(m)}
      <div class="btns"><button class="btn" data-tg="undo">${ICON.undo} Undo last</button><button class="btn orange" data-tg="again">Play again</button></div>
      <div class="btns" style="margin-top:8px"><button class="btn ghost wide" data-tg="home">Back to all games</button></div></div>`;
    this.lastDone = m; window.scrollTo(0, 0);
  },
  stopTable() { if (this.table) { this.table.destroy(); this.table = null; } },
  /* ---------- overlays ---------- */
  openOv(html, closable = true) {
    this.closeOv(); const wrap = document.createElement('div'); wrap.className = 'tg'; const ov = document.createElement('div'); ov.className = 'ov'; wrap.appendChild(ov);
    ov.innerHTML = `<div class="sheet">${closable ? `<button class="iconbtn close" data-tg="close" aria-label="Close">${ICON.close}</button>` : ''}${html}</div>`;
    if (closable) ov.addEventListener('click', e => { if (e.target === ov) this.closeOv(); });
    document.body.appendChild(wrap); this.ov = wrap; document.body.style.overflow = 'hidden';
  },
  closeOv() { if (this.ov) { this.ov.remove(); this.ov = null; document.body.style.overflow = ''; } },
  showBoard() {
    const m = this.m || this.lastDone; if (!m) return; const G = GAMES[m.gid];
    const wasBetween = this.ov && this.ov.querySelector('[data-tg="cont"]');
    this.openOv(`<p class="label">Scoreboard</p><h2 class="title sm" style="font-size:30px;margin-bottom:12px">${G.short}</h2>
      <div class="chips">${G.chips(m).map(c => `<div class="chip"><div class="who">${c.dot != null ? dotHTML(c.dot) : ''}${esc(c.name)}</div><div class="v">${c.v}<small>${c.small || ''}</small></div><div class="sub">${c.sub || ''}</div></div>`).join('')}</div>
      <div style="margin-top:8px">${G.board(m)}</div>
      <div class="btns">${m.hist.length && this.m ? `<button class="btn" data-tg="undo">${ICON.undo} Undo last score</button>` : ''}<button class="btn primary" data-tg="${wasBetween ? 'cont' : 'close'}">${wasBetween ? 'Carry on' : 'Back to the game'}</button></div>
      <p class="foot">${m.mode === 'hybrid' ? 'Hybrid match: real table and app on one board.' : m.mode === 'real' ? 'Scored from the real table.' : 'Played in the app.'}</p>`);
  },
  showRules(gid) { this.openOv(rulesHTML(GAMES[gid])); },
  toast(t) {
    let el = $('.tg .toast'); if (!el) { const w = document.createElement('div'); w.className = 'tg'; el = document.createElement('div'); el.className = 'toast'; w.appendChild(el); document.body.appendChild(w); }
    el.textContent = t; el.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => el.classList.remove('show'), 2400);
  },
  confirmQuit() {
    this.openOv(`<h2 class="title sm" style="font-size:28px">Leave this game?</h2><p>The score is saved on this phone, so you can carry on later from the game's page.${this.where === 'app' && this.table && this.table.shots ? ' The turn in progress will start again.' : ''}</p>
      <div class="btns"><button class="btn" data-tg="close">Stay</button><button class="btn primary" data-tg="leave">Leave</button></div>`);
  },
  bindHolds(el) {
    el.querySelectorAll('[data-hold]').forEach(b => {
      const on = e => { e.preventDefault(); if (b.disabled) return; try { b.setPointerCapture(e.pointerId); } catch (_) { } this.table && this.table.hold && this.table.hold(b.dataset.hold, true); };
      const off = () => this.table && this.table.hold && this.table.hold(b.dataset.hold, false);
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
      b.addEventListener('contextmenu', e => e.preventDefault());
    });
  },
  /* ---------- actions ---------- */
  act(a, el) {
    const [k, x, y] = a.split(':'), st = this.setup;
    switch (k) {
      case 'home': this.home(); break;
      case 'open': this.openSetup(x); break;
      case 'rules': this.showRules(x); break;
      case 'close': this.closeOv(); break;
      case 'mode': {
        st.mode = x; const noCpu = x === 'real' || (x === 'hybrid' && this.G.kind === 'rounds'), names = store.get('names', []);
        st.players.forEach((p, i) => {
          const cpu = !noCpu && (x === 'app' ? p.kind === 'cpu' : p.where === 'cpu');
          if (!cpu && isCpuName(p.name)) p.name = this.G.seat.names ? this.G.seat.names[i] : humanName(i);
          if (cpu && /^Player \d$/.test(p.name)) p.name = cpuName(i);
        });
        this.saveSetup(); this.renderSetup(); break;
      }
      case 'kind': { const p = st.players[+x]; p.kind = y; if (y === 'cpu' && /^Player \d$/.test(p.name)) p.name = cpuName(+x); if (y === 'human' && isCpuName(p.name)) p.name = humanName(+x); this.saveSetup(); this.renderSetup(); break; }
      case 'where': { const p = st.players[+x]; p.where = y; if (y === 'cpu' && /^Player \d$/.test(p.name)) p.name = cpuName(+x); if (y !== 'cpu' && isCpuName(p.name)) p.name = humanName(+x); this.saveSetup(); this.renderSetup(); break; }
      case 'addp': if (st.players.length < this.G.seat.max) { const i = st.players.length; st.players.push({ name: humanName(i), kind: 'human', where: 'real' }); this.saveSetup(); this.renderSetup(); } break;
      case 'rmp': if (st.players.length > Math.max(1, this.G.seat.min)) { st.players.splice(+x, 1); this.saveSetup(); this.renderSetup(); } break;
      case 'opt': { const o = this.G.options.find(o => o.id === x), ch = o.choices.find(c => String(c[0]) === y); st.opts[x] = ch ? ch[0] : y; this.saveSetup(); this.renderSetup(); break; }
      case 'diff': st.diff = x; this.saveSetup(); this.renderSetup(); break;
      case 'start': this.startMatch(); break;
      case 'resume': this.resume(); break;
      case 'board': this.showBoard(); break;
      case 'undo': this.undo(); break;
      case 'quit': this.confirmQuit(); break;
      case 'leave': this.closeOv(); this.save(); this.openSetup(this.G.id); break;
      case 'cont': this.closeOv(); this.nextUnit(); break;
      case 'again': { const gid = (this.lastDone || this.m || {}).gid || this.G.id; this.m = null; if (!this.setup || this.setup.gid !== gid) this.openSetup(gid); this.startMatch(); break; }
      case 'sound': Sound.toggle(); el.innerHTML = Sound.on ? ICON.sound : ICON.mute; if (Sound.on) Sound.init(); break;
      case 'pick': this.startUnit(this.unit, x); break;
      case 'swap': {
        const m = this.m, u = this.unit;
        if (this.G.kind === 'turns') { const p = m.players[u.who]; p.where = this.where === 'real' ? 'app' : 'real'; this.save(); this.startUnit(u, p.where); }
        else this.startUnit(u, this.where === 'real' ? 'app' : 'real');
        break;
      }
      case 'e': { const r = this.G.entryAct(this.m, this.est, x, y); if (r && r.done) this.commit(r.done, 'real'); else this.renderEntry(); break; }
      case 't': if (this.table && this.table.toolAct) this.table.toolAct(x, y); break;
    }
  }
};

/* ---------- rules card page ---------- */
function rulesHTML(G) {
  const R = G.rules, L = 'ABCD';

  <div class="scorecards" style="grid-template-columns:repeat(${s2[1].length},1fr)">${s2[1].map(c => `<div class="sc"><div class="v">${c[0]}</div><b>${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div>

  <div class="tbl"><div class="th"><span>${s3[2][0]}</span><span>${s3[2][1]}</span></div>${s3[3].map((r, i) => `<div class="tr ${i === 0 ? 'hi' : ''}"><div class="tx"><b>${r[0]}</b><span>${r[1]}</span></div><div class="v">${r[2]}</div></div>`).join('')}</div>
  <div class="sec"><span class="n">4</span>${s4[0]}</div><div class="goods">${s4[1].map((g, i) => `<div class="good ${i === 0 ? 'k' : ''}"><b>${g[0]}</b>${g[1]}</div>`).join('')}</div>
  <div class="banner"><div><div class="t">${R.banner[0]}</div><div class="s">${R.banner[1]}</div></div><div class="ic">${G.icon}</div></div>
  <div class="panel lite" style="margin-top:14px"><h3>In the app</h3><p class="note" style="margin:0;color:var(--ink)">${G.appNotes.join(' ')}</p></div>`;
}

window.TableGames = {
  _app: App,
  open: gid => App.openSetup(gid),
  live: gid => { const m = store.get('match.' + gid, null); return !!(m && !m.over); },
  list: () => ORDER.map(id => { const G = GAMES[id]; return { id, name: G.short, tag: G.blurb, icon: G.icon, players: G.seat.max > 2 ? `${G.seat.min}–${G.seat.max} players` : G.seat.label === 'Teams' ? '2 teams' : '2 players or teams' }; })
};
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', () => App.init()); else App.init();

})();

<script>
'use strict';
/* ============ Basics ============ */
const G = {};
const ORDER = { dice: ['zanzibar', 'scc', 'farkle', 'midnight', 'pigs'], cards: ['brag', 'cuckoo', 'skat'], dominoes: ['t42'] };
const PLUM = '#4e1f4d', ORANGE = '#dd7f27', SAND = '#f8dca8', PIG = '#f6b8c4', PIG2 = '#e98fa3';

const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const chance = p => rnd(1e6) < p * 1e6;
const d6 = () => 1 + rnd(6);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = n => Number(n).toLocaleString('en-GB');
const plural = (n, w, pl) => `${n} ${n === 1 ? w : (pl || w + 's')}`;
const nextAlive = (st, i, alive) => { const n = st.players.length; for (let k = 1; k <= n; k++) { const j = (i + k) % n; if (alive(st.players[j], j)) return j; } return -1; };
function log(st, msg) { st.log = st.log || []; st.log.unshift(msg); if (st.log.length > 40) st.log.length = 40; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('pubgames.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pubgames.' + k, JSON.stringify(v)); } catch (e) { } }
};

/* ============ Icons (line style from the cards) ============ */
const sv = (body, vb = '0 0 24 24', extra = '') => `<svg viewBox="${vb}" fill="none" stroke="${PLUM}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${body}</svg>`;
const I = {
  dice: sv(`<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="${PLUM}"/><circle cx="12" cy="12" r="1.2" fill="${PLUM}"/><circle cx="15.5" cy="15.5" r="1.2" fill="${PLUM}"/>`),
  coins: sv(`<ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4M5 10.5v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>`),
  people: sv(`<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.4-3.4 2.6-5.3 5.5-5.3s5.1 1.9 5.5 5.3"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.4 14.4c2.6-.3 4.7 1.4 5.1 4.6"/>`),

  pencil: sv(`<path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/>`),
  heart: sv(`<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.4 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>`),
  pig: sv(`<ellipse cx="11" cy="13" rx="7" ry="5"/><circle cx="18" cy="11" r="3.4"/><path d="M7 17.5v2M14 17.5v2M4 12c-1.2-.5-1.6.8-.6 1.2"/><circle cx="11" cy="12.5" r="1" fill="${PLUM}"/>`),
  bot: sv(`<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4"/><circle cx="12" cy="3.5" r="1"/><circle cx="9" cy="13" r="1.2" fill="${PLUM}"/><circle cx="15" cy="13" r="1.2" fill="${PLUM}"/>`),
  person: sv(`<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-4 3.3-6.2 7-6.2s6.4 2.2 7 6.2"/>`),
  phone: sv(`<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>`),
  back: sv(`<path d="M14.5 5.5L8 12l6.5 6.5"/>`),
  book: sv(`<path d="M4 5.5C6.5 4.5 9.5 4.6 12 6.2c2.5-1.6 5.5-1.7 8-.7v13c-2.5-1-5.5-.9-8 .7-2.5-1.6-5.5-1.7-8-.7z"/><path d="M12 6.2v13"/>`),
  dominoes: sv(`<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M7 12h10"/><circle cx="12" cy="7.2" r="1.2" fill="${PLUM}"/><circle cx="10" cy="15.5" r="1.1" fill="${PLUM}"/><circle cx="14" cy="17.7" r="1.1" fill="${PLUM}"/>`),
  clock: sv(`<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>`),
  ship: sv(`<path d="M3 15h18l-2.5 4.5h-13z"/><path d="M12 15V4l6 8h-6M12 6l-5 7h5"/>`),
  trophy: sv(`<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>`),
};
const heartFill = (on = true) => `<svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-10.6A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 8 2.7c0 5.7-8 10.6-8 10.6z" fill="${on ? ORANGE : 'none'}" stroke="${on ? ORANGE : '#c9b3c8'}" stroke-width="2"/></svg>`;
const coinIc = `<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8.5" fill="#f2a91f" stroke="${PLUM}" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="${PLUM}" stroke-width="2"/></svg>`;

/* ============ Dice ============ */
const PIP = { 1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[30, 30], [50, 50], [70, 70]], 4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]], 6: [[30, 27], [70, 27], [30, 50], [70, 50], [30, 73], [70, 73]] };
function dieInner(v, kept, flat) {
  const f = kept ? ORANGE : '#fff', p = kept ? '#fff' : PLUM;
  let s = flat ? '' : `<rect x="10" y="12" width="86" height="86" rx="20" fill="${PLUM}"/>`;
  s += `<rect x="4" y="4" width="88" height="88" rx="20" fill="${f}" stroke="${PLUM}" stroke-width="${flat ? 8 : 7}"/>`;
  if (v) for (const [x, y] of PIP[v]) s += `<circle cx="${x - 2}" cy="${y - 2}" r="${v === 1 ? 11 : 8.6}" fill="${v === 1 && !kept ? ORANGE : p}"/>`;
  return s;
}
const dieSVG = (v, kept = false, flat = false) => `<svg viewBox="0 0 100 100" role="img" aria-label="${v || 'blank'}">${dieInner(v, kept, flat)}</svg>`;
const mini = (vals, keptIdx = []) => `<span class="mini">${String(vals).split('').map((v, i) => dieSVG(+v, keptIdx.includes(i), true)).join('')}</span>`;
function diceArt(vals, keptIdx = [], spread = 1) {
  const pos = vals.length > 3 ? [[0, 30, -12], [46, 0, 8], [94, 22, 10], [16, 78, 6], [62, 68, -8], [98, 76, 14]] : [[8, 34, -12], [56, 6, 8], [88, 44, 10]];
  let s = `<svg viewBox="0 0 150 130">`;
  vals.forEach((v, i) => { const [x, y, r] = pos[i]; s += `<g transform="translate(${x * spread} ${y}) rotate(${r} 25 25) scale(.52)">${dieInner(v, keptIdx.includes(i))}</g>`; });
  return s + `</svg>`;
}

/* ============ Playing cards ============ */
const SUIT_PATH = {
  H: '<path d="M12 21.2S3 15.4 3 9.3A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 9 2.7c0 6.1-9 11.9-9 11.9z"/>',
  D: '<path d="M12 2.2 20 12l-8 9.8L4 12z"/>',
  S: '<path d="M12 2.5C9.5 6 3.5 9 3.5 13.6A4.4 4.4 0 0 0 11 16.4L9.6 21.5h4.8L13 16.4a4.4 4.4 0 0 0 7.5-2.8C20.5 9 14.5 6 12 2.5z"/>',
  C: '<circle cx="12" cy="7" r="4.3"/><circle cx="7" cy="13.4" r="4.3"/><circle cx="17" cy="13.4" r="4.3"/><path d="M10.7 12h2.6l1.5 9.5H9.2z"/>'
};
const SUIT_NAME = { S: 'spades', H: 'hearts', D: 'diamonds', C: 'clubs' };
const isRed = s => s === 'H' || s === 'D';
const suitSVG = (s, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor">${SUIT_PATH[s]}</svg>`;
const suitInline = s => `<span style="color:${isRed(s) ? ORANGE : PLUM};display:inline-block;width:1em;height:1em;vertical-align:-.12em">${suitSVG(s)}</span>`;
const cardName = c => `${c.r}${suitInline(c.s)}`;
let cardSeq = 0;

function defaultSetup(g) {

  if (saved && saved.players && saved.players.length >= g.min && saved.players.length <= g.max) {

function viewerOf(g, st) {
  const humans = st.players.map((p, i) => p.cpu ? -1 : i).filter(i => i >= 0);
  if (humans.length === 1) return humans[0];
  if (!g.priv) return -2;
  return st.shownTo ?? -1;
}
function needsHandoff(g, st) {
  if (!g.priv || st.over) return -1;
  const humans = st.players.filter(p => !p.cpu).length;
  if (humans < 2) return -1;
  const a = g.actor(st);
  if (a >= 0 && !st.players[a].cpu && st.shownTo !== a) return a;
  return -1;
}

function playView() {
  const g = G[App.gid], st = App.st;
  const ho = needsHandoff(g, st);
  if (ho >= 0) {
    return `<div class="handoff"><p>Pass the phone to</p><div class="who">${esc(st.players[ho].name)}</div><p>Everyone else, no peeking!</p><button class="btn primary" data-act="reveal">I’m ${esc(st.players[ho].name)} · show my cards</button><button class="btn ghost" style="color:#fff;margin-top:8px" data-act="quit">Leave game</button></div>`;
  }
  const v = viewerOf(g, st);
  let over = '';
  if (st.over) over = banner(st.over.t, st.over.s || '', st.over.ic || `<svg viewBox="0 0 48 48">${coinStack()}</svg>`) +
    `<div class="btns">${btn('Play again', 'again', '', 'primary')}${btn('Change players', 'open', g.id)}</div><div class="btns">${btn('All games', 'home', '', 'ghost')}</div>`;
  return `<div class="sheet">
    <div class="bar"><button class="iconbtn" data-act="quit" aria-label="Leave game">${I.back}</button><span class="nm">${g.name}</span><button class="iconbtn" data-act="rules" data-arg="${g.id}">${I.book}Rules</button></div>
    ${g.view(st, v)}
    ${over}
    ${logHTML(st)}
  </div>`;
}

function overlayView() {
  const o = App.overlay;
  if (!o) return '';
  if (o.type === 'rules') return `<div class="ov" data-act="close-bg">${rulesHTML(G[o.gid])}</div>`;
  if (o.type === 'confirm') return `<div class="ov center"><div class="dialog"><h2>${o.title}</h2><p>${o.text}</p><div class="btns">${btn(o.no || 'Keep playing', 'close', '', '')}${btn(o.yes, o.act, o.arg || '', 'primary')}</div></div></div>`;
  return '';
}

function render() {
  const r = root();
  let html = App.view === 'home' ? homeView() : App.view === 'setup' ? setupView() : playView();
  html += overlayView();
  r.innerHTML = html;
  document.body.style.overflow = App.overlay ? 'hidden' : '';
  post();
}

const ANIM_MS = { rolling: 560, tumbling: 820, dealing: 400, flipping: 470 };
function post() {
  clearTimeout(App.timer);
  const chip = root().querySelector('.chip.on');
  if (chip) { const c = chip.parentElement; c.scrollLeft = chip.offsetLeft - c.clientWidth / 2 + chip.clientWidth / 2; }
  if (App.view !== 'play' || !App.st) return;
  const els = root().querySelectorAll('.rolling,.tumbling,.dealing,.flipping');
  if (els.length) {
    let ms = 0;
    els.forEach(el => { const d = parseFloat(el.style.animationDelay) || 0; for (const k in ANIM_MS) if (el.classList.contains(k)) ms = Math.max(ms, d + ANIM_MS[k]); });
    App.busy = true;
    const st = App.st;
    App.timer = setTimeout(() => { clearFlags(st, 0); App.busy = false; if (App.st === st) render(); }, ms);
    return;
  }
  App.busy = false;
  schedule();
}
function clearFlags(o, depth) {
  if (!o || typeof o !== 'object' || depth > 6) return;
  if (Array.isArray(o)) { o.forEach(x => clearFlags(x, depth + 1)); return; }
  for (const k of ['spin', 'deal', 'flip']) if (k in o) delete o[k];
  for (const k in o) if (k !== 'log' && o[k] && typeof o[k] === 'object') clearFlags(o[k], depth + 1);
}
function schedule() {
  if (App.view !== 'play' || App.overlay) return;
  const g = G[App.gid], st = App.st;
  if (!st || st.over) return;
  if (needsHandoff(g, st) >= 0) return;
  const step = g.next(st);
  if (!step) return;
  App.timer = setTimeout(() => { if (App.st !== st || App.overlay) return; step.run(); render(); }, step.ms * SPEEDS[App.speed]);
}

function startGame() {
  const g = G[App.gid], s = App.setup;
  s.players.forEach((p, i) => { p.name = (p.name || '').trim() || (p.cpu ? CPU_NAMES[i] || 'Computer' : 'Player ' + (i + 1)); });
  const names = s.players.map(p => p.name);
  if (new Set(names).size !== names.length) s.players.forEach((p, i) => { if (names.indexOf(p.name) !== i) p.name += ' ' + (i + 1); });
  store.set('setup.' + g.id, s);

  const sortHand = (h, tr) => h.sort((x, y) => (tr !== null && tr !== undefined ? (isTrump(y, tr) - isTrump(x, tr)) || (isTrump(x, tr) ? rank(y, 'T', tr) - rank(x, 'T', tr) : 0) : 0) || y.a - x.a || y.b - x.b);
  const team = i => i % 2;
  const teamPts = (st, k) => sum(st.taken[k].map(COUNT)) + st.tricks[k];

  /* --- computer judgement --- */
  function trumpValue(hand, tr) {
    const n = hand.filter(t => isTrump(t, tr)).length;
    const order = set28().filter(t => isTrump(t, tr)).sort((x, y) => rank(y, 'T', tr) - rank(x, 'T', tr));
    let run = 0; for (const t of order) { if (hand.some(h => key(h) === key(t))) run++; else break; }
    const top = run > 0;
    const offD = hand.filter(t => t.a === t.b && !isTrump(t, tr)).length;
    const ne = n - (top ? 0 : 1.2) + run * .25 + offD * .6;
